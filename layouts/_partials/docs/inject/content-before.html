{{ $img := .Params.image }}

{{ if not $img }}
  {{ if .Parent }}
    {{ $img = .Parent.Params.image }}
  {{ end }}
{{ end }}

{{ if not $img }}
  {{ $img = "LogoT.png" }}
{{ end }}

<div style="position: -webkit-sticky; position: sticky; top: 0; z-index: 999; margin: 0 -2rem 20px -2rem; background-color: rgba(255, 255, 255, 0.95); text-align: center; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); border-radius: 8px 8px 0 0; overflow: hidden;">
  <img src="{{ $img | relURL }}" 
       alt="{{ .Title }}" 
       style="width: 100%; height: 220px; object-fit: cover; display: block;">
</div>
