{{ $img := .Params.image | default .Parent.Params.image | default "/LogoT.png" }}

<div style="text-align: center; margin-bottom: 20px;">
  <img src="{{ $img | relURL }}" 
       alt="{{ .Title }}" 
       style="width: 100%; max-width: 760px; height: 220px; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
</div>
