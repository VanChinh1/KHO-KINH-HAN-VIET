{{ $img := .Params.image }}

{{ if not $img }}
  {{ if .Parent }}
    {{ $img = .Parent.Params.image }}
  {{ end }}
{{ end }}

{{ if not $img }}
  {{ $img = "LogoT.png" }}
{{ end }}

<div style="position: sticky; top: 0; z-index: 100; background-color: rgba(255, 255, 255, 0.95); text-align: center; padding: 10px 0; margin-bottom: 25px; border-radius: 0 0 8px 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);">
  <img src="{{ $img | relURL }}" 
       alt="{{ .Title }}" 
       style="width: 100%; max-width: 760px; height: 180px; object-fit: cover; border-radius: 8px;">
</div>
