<script>
  document.addEventListener("DOMContentLoaded", function () {
    const header = document.querySelector(".book-header");
    if (header && !document.querySelector("#toc-toggle-btn")) {
      // Tạo nút bấm riêng cho Kho Luận ở bên phải header
      const tocBtn = document.createElement("label");
      tocBtn.id = "toc-toggle-btn";
      tocBtn.innerHTML = "📚"; 
      tocBtn.style.cssText = "cursor: pointer; font-size: 1.3rem; margin-left: auto; padding: 0 10px; z-index: 100002; display: flex; align-items: center;";
      header.appendChild(tocBtn);

      // Sự kiện bấm vào nút để mở/đóng Kho Luận
      tocBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        document.body.classList.toggle("toc-open");
        // Đảm bảo đóng menu bên trái nếu đang mở
        document.body.classList.remove("menu-open");
      });
    }

    // Bấm ra vùng nền tối bên ngoài để tự động đóng Kho Luận
    document.addEventListener("click", function (e) {
      if (document.body.classList.contains("toc-open")) {
        const toc = document.querySelector("aside.book-toc");
        const tocBtn = document.querySelector("#toc-toggle-btn");
        if (toc && !toc.contains(e.target) && tocBtn && !tocBtn.contains(e.target)) {
          document.body.classList.remove("toc-open");
        }
      }
    });
  });
</script>
