<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Bắt sự kiện khi bấm vào nhãn nút 3 gạch hoặc checkbox
    const menuLabel = document.querySelector('label[for="menu-control"]');
    const menuControl = document.querySelector("#menu-control");

    if (menuLabel) {
      menuLabel.addEventListener("click", function () {
        // Đảo trạng thái class 'menu-open' trên thẻ body
        document.body.classList.toggle("menu-open");
      });
    }

    // Bấm vào vùng nền tối bên ngoài để đóng menu
    document.addEventListener("click", function (e) {
      if (document.body.classList.contains("menu-open")) {
        // Nếu bấm ra ngoài khung menu và không bấm vào nút mở
        const menu = document.querySelector("aside.book-menu");
        if (menu && !menu.contains(e.target) && menuLabel && !menuLabel.contains(e.target)) {
          document.body.classList.remove("menu-open");
          if (menuControl) menuControl.checked = false;
        }
      }
    });
  });
</script>
