<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Tự động tìm mọi nút bấm hoặc nhãn mở menu trên màn hình di động
    const toggles = document.querySelectorAll('label[for*="menu"], .book-menu-button, header label');
    
    toggles.forEach(toggle => {
      toggle.addEventListener("click", function (e) {
        // Kích hoạt class toggle cho body để CSS quản lý hiển thị
        document.body.classList.toggle("menu-open");
      });
    });

    // Bấm ra vùng nền tối bên ngoài để đóng menu
    document.addEventListener("click", function (e) {
      if (document.body.classList.contains("menu-open")) {
        const menu = document.querySelector("aside.book-menu");
        if (menu && !menu.contains(e.target) && !e.target.closest('label') && !e.target.closest('input')) {
          document.body.classList.remove("menu-open");
        }
      }
    });
  });
</script>
